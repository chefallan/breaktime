<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1c1310" />
    <meta name="color-scheme" content="dark" />

    <!--
      Chromium fires beforeinstallprompt before the bundle has finished parsing,
      and never fires it again. Catching it here, ahead of the module graph, is
      what lets the install gate replay it from a click later on.
    -->
    <script>
      window.__breaktimeInstallPrompt = null
      addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault()
        window.__breaktimeInstallPrompt = event
      })
    </script>

    <title>Breaktime — merienda, sized to your break</title>
    <meta
      name="description"
      content="Filipino merienda for remote workers. Swipe for something to cook and something to sip that actually fits the break you have — 15, 30 or 60 minutes."
    />
    <link rel="canonical" href="https://breaktime.chefallan.xyz/" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Installed-app chrome. The manifest covers Android; iOS still reads these. -->
    <meta name="application-name" content="Breaktime" />
    <meta name="apple-mobile-web-app-title" content="Breaktime" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Absolute URLs: every unfurler resolves these against nothing. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Breaktime" />
    <meta property="og:url" content="https://breaktime.chefallan.xyz/" />
    <meta property="og:title" content="Breaktime — merienda, sized to your break" />
    <meta
      property="og:description"
      content="Filipino merienda for remote workers. Swipe for something to cook and something to sip that actually fits the break you have — 15, 30 or 60 minutes."
    />
    <meta property="og:image" content="https://breaktime.chefallan.xyz/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Breaktime mark — a cream disc with one wedge lifted out of it in purple — beside the word Breaktime."
    />
    <meta property="og:locale" content="en_PH" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Breaktime — merienda, sized to your break" />
    <meta
      name="twitter:description"
      content="Filipino merienda for remote workers. Swipe for something to cook and something to sip that actually fits the break you have."
    />
    <meta name="twitter:image" content="https://breaktime.chefallan.xyz/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The Breaktime mark — a cream disc with one wedge lifted out of it in purple — beside the word Breaktime."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
